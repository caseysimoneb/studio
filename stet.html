<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stet</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"><style>
:root { color-scheme: light; --ink:#000; --paper:#fff; --soft:#8A8A8A; --hair:#D8D8D8; --s:13px; --l:24px; }
* { margin:0; padding:0; box-sizing:border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; }
body { color: var(--ink); font-family: Cardo, Georgia, serif; font-size: 15.5px; line-height: 21px; padding: var(--s); }
a { color: inherit; }
b, strong { font-weight: 700; }
header { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13.25px; height: 52px; margin-top: calc(-1 * var(--s)); border-bottom: 1px solid var(--ink); display:flex; justify-content:space-between; align-items:center; }
header a, header b { text-decoration:none; font-weight:700; }
.draft { color: var(--soft); }
main { display:grid; grid-template-columns: 340px 1fr; column-gap: 80px; padding-top: var(--l); }
.text p, .text ul, .text ol { max-width: 340px; margin-bottom: var(--l); }
.text ul { padding-left: var(--s); }
.list { margin-top: var(--l); }
.list a { display:block; text-decoration:none; margin-bottom: var(--l); max-width: 340px; }
.list a b { display:block; }
.list a:hover b { text-decoration: underline; text-underline-offset: 3px; }
.facts { margin-bottom: var(--l); max-width: 340px; }
.facts div { display:grid; grid-template-columns: 80px 1fr; padding: 3px 0; border-top: 1px solid var(--hair); }
.facts div:last-child { border-bottom: 1px solid var(--hair); }
.facts dt { color: var(--soft); }
figure { align-self:start; justify-self:end; width:100%; max-width: 620px; margin-bottom: var(--l); }
figure img { display:block; width:100%; height:auto; outline: 1px solid var(--hair); }
.plate { max-width: 560px; }
.plate img { outline:none; }
figcaption { color: var(--soft); margin-top: 6px; }
abbr { text-decoration: underline dotted var(--soft); text-underline-offset: 3px; cursor: help; position: relative; }
abbr::after { content: attr(data-gloss); position:absolute; left:0; top:1.6em; width:280px; padding:10px 12px; background: var(--paper); border:1px solid #2120DE; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size:13px; line-height:1.4; opacity:0; pointer-events:none; transition: opacity .15s; z-index:2; }
abbr:hover::after, abbr:focus::after { opacity:1; }
.refs { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--l) var(--l); margin-bottom: var(--l); max-width: 620px; justify-self:end; width:100%; }
.ref img { display:block; width:100%; aspect-ratio: 4/3; object-fit: cover; margin-bottom: 6px; }
.ref b { display:block; }
.ref a { text-decoration:none; }
.ref .note { display:block; color: var(--soft); }
.soontag { font: 400 11px "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--soft); margin-left: 8px; letter-spacing: .02em; }
header nav.elsewhere { display:flex; gap: 16px; margin-left:auto; }
header nav.elsewhere a { font-weight:400; text-decoration:none; }
header nav.elsewhere a:hover { color:#2120DE; }
header .draft:not(:empty) { margin-left: 24px; }
.cite { display:block; font-size: 13px; line-height: 18px; color: var(--soft); margin-top: 4px; }
.cite a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.docwrap { grid-column: 1 / -1; margin-top: calc(var(--l) * 2); padding-top: var(--l); border-top: 1px solid var(--hair); }
.stetwin { max-width: 860px; border: 1px solid #C8C8C8; border-radius: 10px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.10); background:#fff; }
.stetwin .bar { display:flex; align-items:center; gap: 14px; height: 38px; padding: 0 14px; border-bottom: 1px solid #E4E4E4; background: #FAFAFA; font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif; color:#555; }
.stetwin .lights { display:flex; gap: 7px; }
.stetwin .lights i { width: 11px; height: 11px; border-radius: 50%; background:#DCDCDC; display:block; }
.stetwin .tab { font: inherit; background:none; border:0; padding: 0 2px; color:#8A8A8A; cursor:pointer; height: 100%; border-bottom: 2px solid transparent; }
.stetwin .tab:hover { color:#2120DE; }
.stetwin .tab.on { font-weight: 700; color:#000; border-bottom-color:#000; }
.stetwin .sheet[hidden] { display:none; }
.stetwin a.stetbar { display:flex; justify-content:space-between; align-items:center; height: 40px; padding: 0 16px; border-top: 1px solid #E4E4E4; background:#FAFAFA; font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif; color:#555; text-decoration:none; }
.stetwin a.stetbar b { color:#000; }
.stetwin a.stetbar:hover, .stetwin a.stetbar:hover b { color:#2120DE; }
.stetwin .app { margin-left:auto; color:#8A8A8A; }
.stetwin .sheet { height: 520px; overflow-y: auto; padding: 36px 56px 56px; font: 15px/1.55 "Helvetica Neue", Helvetica, Arial, sans-serif; color:#111;
  background-image: radial-gradient(rgba(0,0,0,.12) 1px, transparent 1.2px); background-size: 22px 22px; }
.stetwin .sheet p { margin: 0 0 14px; max-width: 680px; }
.stetwin .sheet h3 { font-size: 15px; margin: 0 0 14px; }
.stetwin .sheet h2 { font-size: 20px; margin: 0 0 18px; } .stetwin .sheet h4 { font-size: 15px; margin: 22px 0 10px; }
.stetwin .sheet ul, .stetwin .sheet ol { margin: 0 0 14px 22px; max-width: 680px; } .stetwin .sheet li { margin-bottom: 4px; }
.stetwin .sheet table { border-collapse: collapse; margin: 6px 0 18px; } .stetwin .sheet td { border: 1px solid #D8D8D8; padding: 6px 14px; }
.stetwin .sheet hr { border:0; border-top: 1px dashed #BDBDBD; margin: 22px 0; }
.doccap { color: var(--soft); margin-top: 10px; max-width: 860px; }
main.secs { display:block; padding-top:0; }
main.airy .sec { padding: 56px 0 80px; column-gap: 96px; }
main.airy .sec:first-child { padding-top: 32px; }
main.airy .sidegrid { gap: 32px; }
.rows { margin: 72px 0 0 calc(340px + 80px); border-top: 1px solid #E4E4E4; }
main.airy .rows { margin-left: calc(340px + 96px); }
details.row > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns: 44px 230px 1fr 20px; gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #E4E4E4; }
details.row > summary::-webkit-details-marker { display:none; }
details.row > summary .n { font: 13.25px "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--soft); }
details.row > summary .h { font-size: inherit; } details.row > summary .t { color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.row > summary .pm { font: 15px "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--soft); }
details.row[open] > summary .pm::before { content: "3"; } details.row:not([open]) > summary .pm::before { content: "+"; }
details.row > summary:hover .h { color:#2120DE; }
details.row > .sec { border-bottom: 1px solid #E4E4E4; padding: 32px 0 64px; grid-template-columns: 300px minmax(0, 1fr); column-gap: 48px; }
details.row > .sec .words p { max-width: 300px; }
details.row > .sec h2 { display:none; }
main.airy .rows ~ * .sec:first-child, main.airy > .sec:first-child { border-bottom: 0; }
@media (max-width: 1100px) { .rows, main.airy .rows { margin-left: 0; } details.row > .sec { grid-template-columns: 1fr; } }
@media (max-width: 760px) { details.row > summary { grid-template-columns: 28px 1fr 20px; } details.row > summary .t { display:none; } }
.sec { display:grid; grid-template-columns: 340px 1fr; column-gap: 80px; padding: var(--l) 0 32px; border-bottom: 1px solid #E4E4E4; }
.sec:last-child { border-bottom:0; }
.sec .words p, .sec .words ul, .sec .words ol { max-width: 340px; margin-bottom: var(--l); }
ol { padding-left: 1.3em; }
.sec .words .pics { margin-bottom: var(--l); }
.sec h2 { font: 700 13.25px/18.55px "Helvetica Neue", Helvetica, Arial, sans-serif; margin-bottom: 16px; }
.sec h2 .n { color: var(--soft); font-weight:400; margin-right: 10px; }
.sec figure { justify-self:auto; max-width:none; margin-bottom:0; }
.sec figure img { outline:none; }
.sec figcaption, p.doccap { font: 12px/16px "Helvetica Neue", Helvetica, Arial, sans-serif; color:#555; }
.duo { display:grid; grid-template-columns: 1fr 1fr; gap: var(--l); align-self:start; max-width: 760px; }
.duo:has(> figure:only-child) { grid-template-columns: 1fr; max-width: 372px; }
.duo figure:only-child img { aspect-ratio: auto; }
.duo:has(> figure:nth-child(2):last-child) { grid-template-columns: 1.85fr 1fr; column-gap: 48px; max-width: 760px; }
.duo figure:nth-child(2) { margin-top: 56px; }
.duo img { width:100%; aspect-ratio: 3/4; object-fit: cover; }
.duo figure:last-child img { aspect-ratio: auto; }
details.pre { border-top: 1px solid #E4E4E4; padding-top: 8px; margin-top: 8px; }
details.pre summary { list-style:none; cursor:pointer; display:flex; gap: 16px; align-items: baseline; }
details.pre summary::-webkit-details-marker { display:none; }
details.pre summary::after { content: "+"; margin-left:auto; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--soft); }
details.pre[open] summary::after { content: "3"; }
details.pre summary:hover .nm { color:#2120DE; }
details.pre .yr { font: 13.25px "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--soft); min-width: 44px; }
details.pre .body { padding: 8px 0 16px 60px; }
details.pre .body p { margin-bottom: 8px; max-width: 560px; }
details.pre .lab { font-style: italic; }
details.pre .pics { display:flex; gap: 16px; margin: 8px 0; }
details.pre figure { width: 260px; }
.tree { font: 12.5px/22px "SF Mono", Menlo, monospace; color:#222; overflow-x:auto; }
.tree .t { display:flex; align-items:flex-start; }
.tree .n { white-space:nowrap; }
.tree .n .d { color: var(--soft); margin-left: 6px; }
.tree .k > .n { padding-right: 10px; }
.tree ul { list-style:none; position:relative; margin:0 0 0 0; padding:0; }
.tree .k > ul { margin-left: 22px; }
.tree .k > ul::before { content:""; position:absolute; left:-22px; top:11px; width:22px; border-top:1px solid #222; }
.tree li { position:relative; padding-left: 16px; }
.tree li::before { content:""; position:absolute; left:0; top:11px; width:10px; border-top:1px solid #222; }
.tree li::after { content:""; position:absolute; left:0; top:0; bottom:0; border-left:1px solid #222; }
.tree li:first-child::after { top:11px; }
.tree li:last-child::after { bottom:auto; height:11px; }
.tree li:only-child::after { display:none; }
.sec pre { font: 12px/18px "SF Mono", Menlo, monospace; background:#F5F5F3; padding: 12px 14px; max-width: 340px; margin-bottom: var(--l); white-space: pre-wrap; overflow-wrap: anywhere; }
.sec code { font: 12.5px "SF Mono", Menlo, monospace; }
.sec figure.side { max-width: 372px; }
.sidegrid figure.side { max-width: none; }
.sidegrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--l); align-items:start; max-width: 820px; }
.sidegrid figure.side img { width:100%; height:auto; }
.wopen { align-self:start; } .wcap { font: 12px/16px "Helvetica Neue", Helvetica, Arial, sans-serif; color:#555; margin-top: 8px; max-width: 860px; }
.sec .docwrap { margin-top:0; padding-top:0; border-top:0; }
a.card { display:grid; grid-template-columns: 96px 1fr; gap: 14px; align-items:center; max-width: 340px; margin-bottom: var(--l); padding: 10px; border: 1px solid var(--hair); border-radius: 8px; text-decoration:none; background:#FAFAFA; }
a.card img { width:96px; aspect-ratio: 4/3; object-fit: cover; object-position: top; border: 1px solid var(--hair); border-radius: 3px; }
a.card .cw { display:flex; flex-direction:column; font: 13px/18px "Helvetica Neue", Helvetica, Arial, sans-serif; }
a.card .cw span { color: var(--soft); }
a.card .go { margin-top: 4px; }
a.card:hover { border-color:#2120DE; } a.card:hover b, a.card:hover .go { color:#2120DE; }
.sec .stetwin .sheet { height: 440px; }
figure img { cursor: zoom-in; }
.ref img { cursor: pointer; }
#lb { position: fixed; inset: 0; background: rgba(255,255,255,.97); display:none; align-items:center; justify-content:center; padding: 32px; z-index: 20; cursor: zoom-out; }
#lb.open { display:flex; }
#lb figure { max-width: 92vw; display:flex; flex-direction:column; align-items:center; margin:0; }
#lb img { max-width: 92vw; max-height: 84vh; object-fit: contain; outline:none; cursor: zoom-out; }
#lb figcaption { font: 13px/18px "Helvetica Neue", Helvetica, Arial, sans-serif; color:#555; margin-top: 10px; max-width: 640px; text-align:center; }
@media (max-width: 760px) { .sec, .duo { grid-template-columns: 1fr; } .sec .words p { max-width:none; } details.pre .body { padding-left: 0; } details.pre .pics { flex-direction: column; } details.pre figure { width:100%; } }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } .text p, .list a, .facts { max-width:none; } figure { justify-self:stretch; margin-top: calc(var(--l) * 2); } }
.list a:hover b, .text p a:hover, .facts a:hover { color:#2120DE; }
</style></head>
<body>
<header><a href="index.html">Studio OS</a><nav class="elsewhere"><a href="https://www.caseysimone.com" target="_blank" rel="noopener">Substack</a><a href="https://codesign.berkeley.edu/" target="_blank" rel="noopener">Co-Design Lab</a></nav><span class="draft"></span></header>
<main><div class="text"><p><b>Stet</b><br><span>A Markdown reader and writing page.</span></p><p>This project page is coming soon. For updates as it comes together, follow on <a href="https://www.caseysimone.com" target="_blank" rel="noopener">Substack</a>.</p></div><div></div></main>
<div id="lb"><figure><img alt=""><figcaption></figcaption></figure></div><script>
document.querySelectorAll('details.row > .sec').forEach(sec => sec.addEventListener('click', e => {
  if (e.target.closest('a, button, input, textarea, pre, svg, iframe, img, li, [contenteditable], .w-hero, .w-clock')) return;
  if (String(getSelection())) return;
  sec.parentElement.open = false;
}));
const lb = document.getElementById('lb');
document.querySelectorAll('main figure img').forEach(img => img.addEventListener('click', () => {
  lb.querySelector('img').src = img.src;
  const c = img.closest('figure').querySelector('figcaption'); lb.querySelector('figcaption').innerHTML = c ? c.innerHTML : '';
  lb.classList.add('open'); }));
lb.addEventListener('click', () => lb.classList.remove('open'));
addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body></html>
