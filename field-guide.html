<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/22px Helvetica,"Helvetica Neue",Arial,sans-serif}
.page{max-width:1240px;margin:0 auto;padding:32px 16px 80px}

/* the shared ground: Jetset, one size */

/* B: the sentence */

 .stage{height:auto;min-height:640px}

{"id": "assets-based-design", "kind": "approach", "name": "assets-based design", "group": "people taking part", "also": "strengths-based design; from asset-based community development (ABCD)", "says": "Start from what communities already have, not their deficits; needs framing can stigmatize and create dependence.", "lineage": "ABCD in community development (Kretzmann & McKnight, 1993); into HCI in the late 2010s (Pei & Nardi; Wong-Villacres et al.).", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["participatory-action-research"], "methods": [], "thinkers": [22, 23, 24, 25], "links": []}, "social-design": {"id": "social-design", "kind": "approach", "name": "social design", "group": "people taking part", "also": "design for social innovation; DESIS; public interest design", "says": "Design should serve social needs over market ones; professionals support and amplify the \"diffuse design\" communities already do (Manzini).", "lineage": "Papanek (1971) and the Margolins' \"social model\" (2002); Manzini and the DESIS network (Politecnico di Milano, c. 2009); public interest design (SEED, from 2005). Reacted against design defined by the market and the expert as sole author.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["action-research", "living-labs", "evaluation-research"], "methods": [], "thinkers": [243, 244, 245], "links": [37]}, "sociotechnical-design": {"id": "sociotechnical-design", "kind": "approach", "name": "sociotechnical design", "group": "people taking part", "also": "socio-technical systems design; the Tavistock approach; ETHICS (Mumford)", "says": "Work systems are social and technical at once and must be designed together, with workers taking part in designing their own jobs.", "lineage": "The Tavistock Institute: Trist & Bamforth's coal-mining studies (1951), Cherns's principles (1976), Mumford's ETHICS method (1979/1983); revived in systems engineering (Baxter & Sommerville, 2011). Older than PD, from management science (consensus) rather than unions (conflict).", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["action-research", "soft-systems-methodology", "action-design-research"], "methods": [], "thinkers": [246, 247, 248, 249, 250], "links": [35]}, "human-centered-design": {"id": "human-centered-design", "kind": "approach", "name": "human-centered design", "group": "people at the center", "also": "HCD; user-centered design (UCD); usability engineering (overlapping); humanity-centered design (Norman, 2023)", "says": "Start from people's needs, capacities, and contexts rather than the technology, and test with them early and often.", "lineage": "Two strands under one name: UCD from cognitive science and HCI at UC San Diego (Norman & Draper, 1986; Gould & Lewis, 1985), into ISO 9241-210 and, via IDEO and the d.school, design thinking; and UK \"human-centred technology\" (Cooley; Rosenbrock), a labor critique of automation closer to PD.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["user-centered-design-process", "contextual-design", "goal-directed-design", "design-thinking", "double-diamond", "product-development-process"], "methods": ["contextual-inquiry", "technology-probes", "log-analysis", "competitive-analysis", "aeiou", "poems", "card-sorting", "personas", "journey-maps", "service-blueprints", "why-how-laddering", "empathy-map", "how-might-we", "kano-analysis", "task-analysis", "scenario-based-design", "experience-prototyping", "bodystorming", "wizard-of-oz", "speed-dating", "paper-prototyping", "wireframe-prototyping", "usability-testing", "heuristic-evaluation", "cognitive-walkthrough", "system-usability-scale", "usability-report"], "thinkers": [26, 27, 28, 29, 30, 31, 32, 33, 293, 382, 383], "links": [1, 9, 10, 42, 43]}, "experience-design": {"id": "experience-design", "kind": "approach", "name": "experience design", "group": "people at the center", "also": "experience-centred design; technology as experience; emotional, pleasurable, and positive design (variants)", "says": "What people design for is lived experience (felt, sensual, emotional, meaning-making), not task completion; usability is necessary but not sufficient.", "lineage": "Dewey's pragmatism via McCarthy & Wright (2004); Hassenzahl's experience design (2010); Forlizzi & Battarbee (2004). Variants: Norman's emotional design (2004), Jordan's pleasurable products (2000), Desmet & Pohlmeyer's positive design (2013). Reacted against usability engineering.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["user-centered-design-process", "research-through-design", "phenomenology"], "methods": ["repertory-grid"], "thinkers": [278, 279, 280, 281, 282, 283], "links": [42]}, "activity-centered-design": {"id": "activity-centered-design", "kind": "approach", "name": "activity-centered design", "group": "people at the center", "also": "activity theory in HCI; distributed cognition (a related theory)", "says": "The unit of design is the activity (a subject working toward an object through tools, within a community and its rules), not the individual user.", "lineage": "Soviet cultural-historical psychology (Vygotsky, Leont'ev) and Engeström (1987); into HCI via Bødker (1991), Nardi (1996), Gay & Hembrooke (2004), Kaptelinin & Nardi (2006); Norman's \"HCD considered harmful\" (2005). Reacted against cognitivist, individual-user HCI.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["design-ethnography", "contextual-design"], "methods": [], "thinkers": [290, 291, 292], "links": [43]}, "persuasive-design": {"id": "persuasive-design", "kind": "approach", "name": "persuasive design", "group": "people at the center", "also": "persuasive technology; captology; behavior-change design; nudge; critiques: dark patterns, deceptive design", "says": "Contested. Its advocates hold design should deliberately change what people do or believe; its critics hold that in practice it answers to the firm, and that manipulation is a failure of design ethics.", "lineage": "Fogg's Persuasive Technology Lab (Stanford, late 1990s; book 2003); Thaler & Sunstein's <em>Nudge</em> (2008); Lockton's Design with Intent (2010). The critique: \"dark patterns\" (Brignull, 2010); Gray et al. (2018); Mathur et al. (2019).", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["experimental-research"], "methods": [], "thinkers": [251, 252, 253, 254, 255], "links": [44]}, "universal-design": {"id": "universal-design", "kind": "approach", "name": "universal design", "group": "access", "also": "UD; design for all (Europe); barrier-free design (predecessor)", "says": "Environments and products should be usable by as many people as possible without adaptation; disability is part of the human range.", "lineage": "Postwar barrier-free design and the US disability rights movement; \"universal design\" credited to Ronald Mace (c. 1985) and the Seven Principles (NC State, 1997). Hamraie (2017) shows a longer, more political history than the \"Mace coined it\" story.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["user-centered-design-process"], "methods": [], "thinkers": [34, 35, 36, 37], "links": [5, 6, 27]}, "inclusive-design": {"id": "inclusive-design", "kind": "approach", "name": "inclusive design", "group": "access", "also": "design for diversity; \"solve for one, extend to many\"", "says": "Exclusion is produced by design decisions; design with and for the full range of human difference, often through flexibility rather than one solution.", "lineage": "UK, early 1990s (Coleman, RCA; Cambridge's exclusion auditing, Clarkson and Keates); Canada (Treviranus, OCAD); Microsoft's toolkit (Holmes, 2016). Reacted against UD's single universal solution and the \"average user.\"", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["user-centered-design-process"], "methods": [], "thinkers": [38, 39, 40, 41, 42], "links": [5]}, "critical-access": {"id": "critical-access", "kind": "approach", "name": "critical access", "group": "access", "also": "disability-led design; design for disability; crip technoscience", "says": "Disabled people are knowers and makers, not users to be fixed or empathized with; access is political and collective, not a checklist.", "lineage": "The disability rights movement (\"nothing about us without us\"), the social model, and disability studies; a design-culture path (Pullin; Hendren) and a critical STS path (Hamraie; Hamraie & Fritsch; Shew), taken up in HCI accessibility (Mankoff et al.; Bennett & Rosner).", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["participatory-action-research", "research-through-design"], "methods": [], "thinkers": [36, 43, 44, 45, 46, 47, 48, 49, 50], "links": [6, 26]}, "disability-justice": {"id": "disability-justice", "kind": "approach", "name": "disability justice", "group": "access", "also": "DJ; crip politics", "says": "Disability is political and bound up with race, gender, class, and queerness; design answers to the disabled people most affected, values interdependence, and treats access as collective care.", "lineage": "Named around 2005 by disabled queer people and people of color (Berne, Mingus, Milbern, Moore, Clare, Margaret); Sins Invalid's 10 principles (2015; WSQ 2018). Reacted against single-issue, compliance-centered disability rights. Into HCI via crip technoscience and CHI workshops (Sum et al., 2022).", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["participatory-action-research"], "methods": [], "thinkers": [216, 217, 218, 219, 220], "links": [26, 27]}, "value-sensitive-design": {"id": "value-sensitive-design", "kind": "approach", "name": "value sensitive design", "group": "values, power, and justice", "also": "VSD; neighbors: design for values (Delft), values in design, values at play; ethics by design; responsible innovation (RRI)", "says": "Technologies embody values whether or not designers intend it, so values, and indirect stakeholders, should be accounted for deliberately throughout design.", "lineage": "Friedman with Kahn and Borning, University of Washington, from the early 1990s (named 1996), from computer ethics and moral psychology; critiqued from within for a priori, universal values (Le Dantec et al., 2009; Borning & Muller, 2012).", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["tripartite-methodology"], "methods": ["value-scenarios", "envisioning-cards"], "thinkers": [51, 52, 53, 54, 56, 57, 294, 295], "links": [7, 44]}, "design-justice": {"id": "design-justice", "kind": "approach", "name": "design justice", "group": "values, power, and justice", "also": "Design Justice Network; neighbors: liberatory design, equity-centered design (different lineages); abolitionist design; anti-oppressive design (Smyth & Dimond, 2014, a precursor)", "says": "Design reproduces or challenges the matrix of domination, so it should be led by the communities most affected, with benefits and burdens shared fairly; impact matters more than intent.", "lineage": "Movement organizing: the Allied Media Conference, Detroit, 2015, then the Design Justice Network principles (2016/2018); scholarly form in Costanza-Chock (2018, 2020), from Black feminist thought, environmental and disability justice, PD, and media justice.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["participatory-action-research", "action-research"], "methods": ["co-design-workshops"], "thinkers": [58, 59, 60, 61, 62, 300, 301], "links": [2, 7, 8, 28]}, "feminist-hci": {"id": "feminist-hci", "kind": "approach", "name": "feminist HCI", "group": "values, power, and justice", "also": "feminist interaction design; neighbors: data feminism, intersectional HCI", "says": "Attend to who technology marginalizes, whose knowledge counts, and how power, care, and the body enter design; knowledge is situated, so positionality is part of the method.", "lineage": "Feminist STS (Haraway, Harding, Suchman) named for HCI by Shaowen Bardzell at CHI 2010; into intersectional and queer HCI, design justice, data feminism.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["action-research", "design-ethnography", "first-person-research"], "methods": ["autobiographical-design", "autoethnography"], "thinkers": [59, 62, 63, 64, 65, 66, 67], "links": [8, 32, 34]}, "queer-hci": {"id": "queer-hci", "kind": "approach", "name": "queer HCI", "group": "values, power, and justice", "also": "queering HCI; trans HCI (adjacent)", "says": "Interfaces and data schemas that encode binary gender and fixed identity should be queered; design can support fluid and non-normative lives.", "lineage": "Queer theory (Butler, Sedgwick, Ahmed) and feminist HCI; Light (2011) as th rough-design"], "methods": [], "thinkers": [228, 229, 230, 231, 232, 233, 300], "links": [32, 33]}, "liberatory-design": {"id": "liberatory-design", "kind": "approach", "name": "liberatory design", "group": "values, power, and justice", "also": "Liberatory Design (National Equity Project and the d.school); Equity-Centered Community Design (Creative Reaction Lab)", "says": "A design process is never neutral: designers first notice their own identity and power, and the people most affected by inequity co-lead; the aim is to redesign systems that produce inequity.", "lineage": "Convened in 2016 (Anaissie, Clifford, Wise, Cary, Malarkey; cards 2017, 2021); ECCD from Creative Reaction Lab, St. Louis, after Ferguson (2014). Reacted against design thinking as taught for being power-blind. Grew in K–12 and civic practice. A modified design-thinking process, not a movement like design justice.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["design-thinking"], "methods": [], "thinkers": [226, 227], "links": [28, 29]}, "care-centered-design": {"id": "care-centered-design", "kind": "approach", "name": "care-centered design", "group": "values, power, and justice", "also": "design for care; care ethics in design; matters of care", "says": "Design maintains, continues, and repairs a world of interdependent beings, so it answers to the relations of care it makes or breaks, including invisible care labor.", "lineage": "Feminist ethics of care (Gilligan, 1982; Noddings, 1984; Tronto, 1993); STS (Mol; Puig de la Bellacasa, 2017); in design, Light & Akama (2014) and Toombs, Bardzell & Bardzell (2015). Not \"design for healthcare\", which is a topic.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["design-ethnography", "action-research"], "methods": [], "thinkers": [218, 234, 235, 236, 237], "links": [34]}, "trauma-informed-design": {"id": "trauma-informed-design", "kind": "approach", "name": "trauma-informed design", "group": "values, power, and justice", "also": "trauma-informed computing; healing-centered design (related)", "says": "Trauma is widespread and design can re-traumatize; every interaction should be paced, consented to, and reversible, after the six principles of trauma-informed care.", "lineage": "Trauma-informed care in social work and behavioral health (SAMHSA, 2014), then architecture and placemaking, then HCI (Chen et al., 2022). Young as design literature; could sit under care-centered design.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": [], "methods": [], "thinkers": [238, 239], "links": []}, "speculative-and-critical-design": {"id": "speculative-and-critical-design", "kind": "approach", "name": "speculative and critical design", "group": "critique and speculation", "also": "SCD; critical design; speculative design; discursive design (umbrella); discursive design (Tharp & Tharp, the umbrella above)", "says": "Design can question rather than solve: objects from possible or alternative worlds make assumptions about technology and values debatable.", "lineage": "Dunne at the RCA (<em>Hertzian Tales</em>, 1999), then Dunne & Raby's Design Interactions (2005–15); roots in Italian Radical Design and conceptual art; strong decolonial and feminist critique from c. 2014.", "kindof": "", "q": "", "tie": "", "data": "", "analysis": "", "contested": "", "phase": "", "stage": "", "mode": "", "approaches": [], "methodologies": ["research-through-design", "scenario-planning"], "methods": ["cultural-probes", "design-fiction", "diegetic-prototypes"], "thinkers": [78, 79, 80, 81, 82, 83, 204, 273, 382], "links": [11, 12, 13, 33, 40]}, "reflective-design": {"id": "reflective-design", "kind": "approach", "name": "reflective desi  function timeline(){const w2=900,h2=300,x0=120,x1=880,y0={approach:52,methodology:142,method:232},band=64,Y0=1940,Y1=2026;const X=y=>x0+(x1-x0)*(y-Y0)/(Y1-Y0);
